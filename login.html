<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港澳识别系统 - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #e0f7fa 0%, #f1f8e9 50%, #fff3e0 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-page {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 40px 30px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}

.login-box h1 {
  font-size: 28px;
  color: #2e7d32;
  margin-bottom: 5px;
  letter-spacing: 2px;
  font-weight: 700;
}

.login-box .subtitle {
  font-size: 14px;
  color: #999;
  margin-bottom: 30px;
}

.login-box .input-group {
  margin-bottom: 12px;
}

.login-box input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e8f5e9;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  background: #fafff5;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.login-box input:focus {
  border-color: #66bb6a;
  box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.15);
}

.login-box input::placeholder {
  color: #bbb;
}

.login-box .btn-login {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #66bb6a, #43a047);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  margin-top: 5px;
  box-shadow: 0 4px 12px rgba(76,175,80,0.3);
}

.login-box .btn-login:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(76,175,80,0.4);
}

.login-box .btn-login:active {
  transform: translateY(0);
}

.login-box .btn-card {
  background: linear-gradient(135deg, #ffa726, #fb8c00);
  box-shadow: 0 4px 12px rgba(255,152,0,0.3);
}

.login-box .btn-card:hover {
  box-shadow: 0 6px 16px rgba(255,152,0,0.4);
}

.login-box .divider {
  margin: 20px 0;
  border: none;
  border-top: 1px solid #eee;
}

.login-box .link-tab {
  font-size: 13px;
  color: #66bb6a;
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.login-box .link-tab:hover {
  color: #43a047;
  text-decoration: underline;
}

.login-box .error-msg {
  color: #e74c3c;
  font-size: 13px;
  margin-top: 8px;
  min-height: 20px;
}

.login-box .card-section {
  display: none;
}

/* 加载动画 */
@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

/* 手机端适配 */
@media (max-width: 480px) {
  .login-box {
    padding: 30px 20px;
  }
  .login-box h1 {
    font-size: 24px;
  }
}
</style>
</head>
<body>
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>港澳·识别</h1>
    <div class="subtitle">下注订单识别系统</div>

    <!-- 管理员登录 -->
    <div id="adminSection">
      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="管理员密码" autocomplete="off">
      </div>
      <button class="btn-login" id="adminLoginBtn">管理员登录</button>
    </div>

    <!-- 卡密登录 -->
    <div class="card-section" id="cardSection">
      <div class="input-group">
        <input type="text" id="cardInput" placeholder="卡密" autocomplete="off">
      </div>
      <button class="btn-login btn-card" id="cardLoginBtn">卡密登录</button>
    </div>

    <hr class="divider">

    <div id="errorMsg" class="error-msg"></div>

    <a class="link-tab" id="switchToCard" onclick="switchToCard()">使用卡密登录</a>
    <a class="link-tab" id="switchToAdmin" onclick="switchToAdmin()" style="display:none;">管理员登录</a>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// ===== 登录逻辑 =====
function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>登录中...';
  } else {
    btn.disabled = false;
    btn.innerHTML = btnId === 'cardLoginBtn' ? '卡密登录' : '管理员登录';
  }
}

function doLogin(sessionData) {
  setAuthSession(sessionData);
  showError('');
  window.location.href = 'index.html';
}

// 管理员登录
document.getElementById('adminLoginBtn').addEventListener('click', function() {
  const pwd = document.getElementById('passwordInput').value.trim();
  if (!pwd) { showError('请输入管理员密码'); return; }
  setLoading('adminLoginBtn', true);
  setTimeout(() => {
    if (pwd === ADMIN_PASSWORD) {
      doLogin({ role: 'admin' });
    } else {
      showError('管理员密码错误');
      setLoading('adminLoginBtn', false);
    }
  }, 300);
});

// 卡密登录
document.getElementById('cardLoginBtn').addEventListener('click', function() {
  const code = document.getElementById('cardInput').value.trim().toUpperCase();
  if (!code) { showError('请输入卡密'); return; }
  setLoading('cardLoginBtn', true);
  setTimeout(() => {
    const result = checkCardAccess(code);
    if (result.valid) {
      doLogin({ role: 'card', cardCode: code });
    } else {
      showError(result.reason);
      setLoading('cardLoginBtn', false);
    }
  }, 300);
});

// 回车键触发登录
document.getElementById('passwordInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('adminLoginBtn').click();
});
document.getElementById('cardInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('cardLoginBtn').click();
});

// 切换登录方式
function switchToCard() {
  document.getElementById('adminSection').style.display = 'none';
  document.getElementById('cardSection').style.display = 'block';
  document.getElementById('switchToCard').style.display = 'none';
  document.getElementById('switchToAdmin').style.display = 'inline-block';
  document.getElementById('errorMsg').textContent = '';
  setTimeout(() => document.getElementById('cardInput').focus(), 100);
}

function switchToAdmin() {
  document.getElementById('adminSection').style.display = 'block';
  document.getElementById('cardSection').style.display = 'none';
  document.getElementById('switchToCard').style.display = 'inline-block';
  document.getElementById('switchToAdmin').style.display = 'none';
  document.getElementById('errorMsg').textContent = '';
  setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}

// 自动聚焦
setTimeout(() => document.getElementById('passwordInput').focus(), 200);
</script>
</body>
</html>
